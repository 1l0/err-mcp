name: release

# Tag pushes publish a release. workflow_dispatch rebuilds an existing tag,
# which is how a failed run is retried without moving the tag: Go module
# proxies and the checksum database cache a tag's content permanently, so tags
# must never be force-pushed once published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, for example v0.10.0
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  # A tag push stores the tag in GITHUB_REF_NAME; a manual run takes it from the
  # input and checks that tag out, so the artifacts always match the tag.
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  licenses:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Collect third-party license texts
        run: ./scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  build:
    needs: licenses
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          # The runner is linux/amd64, so only that target can be executed here.
          - { goos: linux, goarch: amd64, native: true }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: licenses
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="err-mcp_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          exe=""
          if [ "$GOOS" = "windows" ]; then exe=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/$name/err-mcp${exe}" .
          cp THIRD_PARTY_LICENSES.txt "dist/$name/"
          cp LICENSE "dist/$name/"
          cp packaging/README.txt "dist/$name/README.txt"
      - name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="err-mcp_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi
      - name: Smoke test the binary
        # Cross-compiled targets cannot run on this runner (an arm64 ELF fails
        # with "Exec format error"), so only the native build is executed.
        if: matrix.native
        run: |
          set -euo pipefail
          name="err-mcp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          "./dist/$name/err-mcp" --version | grep -Fx "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip >SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes dist/*
          fi

  # Guards the headline install path: the tag must be resolvable by the Go
  # toolchain, and the command must build without the repository checkout.
  go-install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go install github.com/1l0/err-mcp@${{ env.VERSION }}
        env:
          GOPROXY: direct
          GOBIN: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if go install "github.com/1l0/err-mcp@$VERSION"; then
              break
            fi
            echo "go install failed (attempt $attempt); retrying" >&2
            sleep 15
          done
          "$GOBIN/err-mcp" --version | grep -Fx "$VERSION"
